# Root config used ONLY by Cloudflare Workers Builds (the dashboard Git
# integration), which runs `wrangler` from the repository root.
#
# The source of truth for the GitHub Actions deploy is worker/wrangler.toml.
# This file points at the same worker/ sources so the native Cloudflare build
# doesn't fail with "Missing entry-point". Keep the two in sync, or disconnect
# Workers Builds and rely on GitHub Actions alone.

name = "tablerino"
main = "worker/src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "worker/public"
binding = "ASSETS"
run_worker_first = true

[vars]
BASE_URL = "https://tablerino.ro"
GROQ_MODEL = "meta-llama/llama-4-scout-17b-16e-instruct"

[[d1_databases]]
binding = "DB"
database_name = "tablerino"
database_id = "3cc0b84d-ada3-4a08-9d8f-9863f7ab320f"

# R2 stays disabled (image uploads off) until the bucket is created.
# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "tablerino-uploads"
