<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c47ff">
<link rel="manifest" href="/ospatar/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/uploads/favicon-32.png">
<link rel="apple-touch-icon" href="/uploads/apple-touch-icon.png">
<title>Tablerino Ospătar — Autentificare</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(160deg, #1a1a2e 0%, #2d2250 100%); color: #fff;
       min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.card { width: 100%; max-width: 380px; background: #fff; color: #111; border-radius: 20px; padding: 32px 26px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.35); }
.logo { display: flex; justify-content: center; margin-bottom: 10px; }
.logo img { height: 92px; width: auto; object-fit: contain; }
h1 { font-size: 19px; text-align: center; margin-bottom: 4px; }
.sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 26px; }
label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
input { width: 100%; padding: 13px 15px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; margin-bottom: 16px; outline: none; transition: border-color .15s; }
input:focus { border-color: #6c47ff; }
button { width: 100%; padding: 14px; background: #6c47ff; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; }
button:disabled { opacity: .6; }
.err { background: #fee2e2; color: #b91c1c; padding: 11px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; display: none; }
.foot { text-align: center; margin-top: 18px; font-size: 12px; color: #aaa; }
.foot a { color: #6c47ff; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
    <div class="logo"><img src="/uploads/logo-tablerino.png" alt="Tablerino"></div>
    <h1>Panou Ospătar</h1>
    <p class="sub">Autentifică-te cu contul de ospătar</p>
    <div class="err" id="err"></div>
    <form id="form" autocomplete="on">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="ospatar@restaurant.ro" autocomplete="username" required>
        <label for="parola">Parolă</label>
        <input type="password" id="parola" name="parola" placeholder="••••••••" autocomplete="current-password" required>
        <button type="submit" id="btn">Intră în tură</button>
    </form>
    <div class="foot">Ești administrator? <a href="/admin/login.html">Panou admin</a></div>
</div>
<script>
const form = document.getElementById('form');
const errBox = document.getElementById('err');
const btn = document.getElementById('btn');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Se verifică...';
    const email = document.getElementById('email').value.trim();
    const parola = document.getElementById('parola').value;
    try {
        const r = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, parola })
        });
        const d = await r.json().catch(() => ({}));
        if (r.ok && d.ok) {
            // Route by role: waiters get this phone app; others go to the admin panel / kitchen screen.
            var dest = { ospatar: '/ospatar/', bucatarie: '/admin/bucatarie.html', sef_sala: '/admin/index.html', owner: '/admin/index.html' };
            location.href = dest[d.role] || '/ospatar/';
            return;
        }
        errBox.textContent = d.msg || 'Email sau parolă incorecte.';
        errBox.style.display = 'block';
    } catch (err) {
        errBox.textContent = 'Eroare de conexiune. Reîncearcă.';
        errBox.style.display = 'block';
    }
    btn.disabled = false; btn.textContent = 'Intră în tură';
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/ospatar/sw.js').catch(() => {});
</script>
</body>
</html>
