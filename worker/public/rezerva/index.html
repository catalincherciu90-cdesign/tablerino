<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Rezervă o masă la restaurantele din platforma Tablerino.">
<title>Rezervă o masă — Tablerino</title>
<link rel="icon" type="image/png" sizes="32x32" href="/uploads/favicon-32.png">
<link rel="apple-touch-icon" href="/uploads/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17120f; --bg2:#201913; --card:#241d17; --line:#392f26;
  --cream:#f3eadc; --muted:#c9bba7; --gold:#c9a66b; --gold-d:#b08f52;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--cream);min-height:100vh;
     background-image:radial-gradient(1200px 500px at 50% -10%, #2c2219 0%, transparent 60%);}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 0;border-bottom:1px solid var(--line)}
.brand{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;letter-spacing:.3px}
.brand span{color:var(--gold)}
.back{font-size:13px;color:var(--muted);border:1px solid var(--line);padding:8px 14px;border-radius:30px;transition:.15s}
.back:hover{border-color:var(--gold);color:var(--cream)}
.hero{text-align:center;padding:56px 0 34px}
.hero .eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:14px}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(32px,6vw,52px);font-weight:700;line-height:1.05}
.hero h1 em{color:var(--gold);font-style:italic}
.hero p{color:var(--muted);margin-top:16px;font-size:16px;max-width:560px;margin-left:auto;margin-right:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;padding:16px 0 60px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;transition:.18s}
.rcard:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.rtop{display:flex;align-items:center;gap:14px}
.ravatar{width:58px;height:58px;border-radius:14px;flex:0 0 auto;object-fit:cover;background:#2e251d;display:flex;align-items:center;justify-content:center;
         font-family:'Playfair Display',serif;font-size:26px;color:var(--gold);border:1px solid var(--line)}
.rname{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;line-height:1.2}
.rsub{font-size:12.5px;color:var(--muted);margin-top:3px}
.rbtn{margin-top:auto;display:block;text-align:center;background:var(--gold);color:#201913;font-weight:700;font-size:14px;
      padding:12px;border-radius:12px;transition:.15s;letter-spacing:.3px}
.rbtn:hover{background:var(--cream)}
.gol{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px;line-height:1.7}
.gol a{color:var(--gold);font-weight:600}
footer{border-top:1px solid var(--line);padding:26px 0;text-align:center;color:var(--muted);font-size:13px}
.skel{height:150px;border-radius:16px;background:linear-gradient(90deg,#241d17,#2c241c,#241d17);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(max-width:560px){ .hero{padding:40px 0 24px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="/" class="brand">Tabler<span>i</span>no</a>
    <a href="/" class="back">← Înapoi</a>
  </header>

  <section class="hero">
    <div class="eyebrow">Rezervări Tablerino</div>
    <h1>Rezervă o masă la <em>restaurantele</em> din platformă</h1>
    <p>Alege restaurantul, data și ora. Rezervarea ajunge direct la restaurant.</p>
  </section>

  <div class="grid" id="grid">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
</div>

<footer>Tablerino — platformă pentru restaurante · <a href="/" style="color:var(--gold)">tablerino.ro</a></footer>

<script>
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function initiala(nume){ const n=(nume||'').trim(); return n ? n[0].toUpperCase() : '🍽'; }

async function incarca(){
  const grid = document.getElementById('grid');
  try{
    const r = await fetch('/api/rezervare/restaurante');
    const d = await r.json();
    if(!d.ok || !d.restaurante.length){
      grid.innerHTML = `<div class="gol" style="grid-column:1/-1">Momentan niciun restaurant nu are rezervările publice active.<br>Ești restaurant pe Tablerino? Activează din <a href="/admin/rezervari.html">panoul tău</a>.</div>`;
      return;
    }
    grid.innerHTML = d.restaurante.map(x => {
      const av = x.logo
        ? `<img class="ravatar" src="/${esc(x.logo)}" alt="${esc(x.nume)}" onerror="this.outerHTML='<div class=\\'ravatar\\'>${initiala(x.nume)}</div>'">`
        : `<div class="ravatar">${initiala(x.nume)}</div>`;
      return `<div class="rcard">
        <div class="rtop">${av}<div><div class="rname">${esc(x.nume)}</div><div class="rsub">Rezervare online</div></div></div>
        <a class="rbtn" href="/rezervare/?token=${encodeURIComponent(x.token)}">Rezervă o masă</a>
      </div>`;
    }).join('');
  }catch(e){
    grid.innerHTML = `<div class="gol" style="grid-column:1/-1">Eroare la încărcare. Reîncearcă.</div>`;
  }
}
incarca();
</script>
</body>
</html>
