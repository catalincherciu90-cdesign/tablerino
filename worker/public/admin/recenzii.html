<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/uploads/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/uploads/favicon-16.png">
<link rel="apple-touch-icon" href="/uploads/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablerino - Recenzii</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #f0f0f5; color: #111; }
.sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; background: #1a1a2e; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; }
.sidebar .logo { margin-bottom: 20px; padding: 4px; display: flex; align-items: center; justify-content: center; }
.sidebar .logo img { height: 64px; width: auto; object-fit: contain; background: #fff; border-radius: 10px; padding: 6px; }
.sidebar a { color: #aaa; text-decoration: none; padding: 10px 12px; border-radius: 8px; font-size: 14px; display: flex; align-items: center; gap: 10px; transition: background .15s, color .15s; }
.sidebar a:hover, .sidebar a.activ { background: #6c47ff; color: #fff; }
.sidebar .logout { margin-top: auto; }
.main { margin-left: 220px; padding: 32px; max-width: 900px; }
.main h2 { font-size: 20px; margin-bottom: 8px; }
.main p.sub { color: #888; font-size: 14px; margin-bottom: 24px; }

.sumar-box { background: #fff; border-radius: 14px; padding: 26px 24px; box-shadow: 0 1px 8px rgba(0,0,0,0.06); margin-bottom: 28px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.sumar-medie { font-size: 48px; font-weight: 800; line-height: 1; color: #111; }
.sumar-dreapta { display: flex; flex-direction: column; gap: 6px; }
.sumar-stele { font-size: 26px; letter-spacing: 2px; line-height: 1; }
.star-on { color: #f59e0b; }
.star-off { color: #e2e2ea; }
.sumar-text { color: #888; font-size: 14px; }
.sumar-gol { color: #aaa; font-size: 18px; font-weight: 700; }

.recenzii-lista { display: flex; flex-direction: column; gap: 14px; }
.recenzie-card { background: #fff; border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 8px rgba(0,0,0,0.06); border-left: 4px solid #f59e0b; }
.rec-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.rec-stele { font-size: 18px; letter-spacing: 1px; white-space: nowrap; }
.rec-data { font-size: 12px; color: #aaa; white-space: nowrap; }
.rec-coment { font-size: 15px; color: #222; line-height: 1.5; margin-bottom: 12px; white-space: pre-wrap; word-break: break-word; }
.rec-coment.gol { color: #bbb; font-style: italic; }
.rec-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.rec-meta-info { font-size: 13px; color: #666; display: flex; gap: 14px; flex-wrap: wrap; }
.rec-meta-info span { display: flex; align-items: center; gap: 5px; }
.btn-sterge { padding: 8px 14px; background: #ffebee; color: #c62828; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn-sterge:hover { opacity: .85; }
.gol { color: #aaa; font-size: 14px; padding: 40px; text-align: center; }
.toast { position: fixed; bottom: 24px; right: 24px; background: #10b981; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 13px; display: none; z-index: 999; }
.toast.err { background: #e53e3e; }

@media (max-width: 768px) {
    .header-mobil { display: flex !important; }
    .sidebar { position: fixed; left: 0; right: 0; top: auto; bottom: 0; width: 100%; height: 62px; flex-direction: row; padding: 0; justify-content: space-around; align-items: center; border-top: 1px solid #2a2a3e; z-index: 100; overflow-x: auto; }
    .sidebar .logo { display: none; }
    .sidebar .logout { margin-top: 0; }
    .sidebar a { flex-direction: column; gap: 2px; font-size: 10px; padding: 6px 8px; border-radius: 6px; flex: 1; justify-content: center; text-align: center; font-weight: 600; }
    .main { margin-left: 0 !important; padding: 14px 12px 80px !important; }
    .main h2 { font-size: 18px !important; }
    .sumar-box { gap: 16px; padding: 18px; }
    .sumar-medie { font-size: 40px; }
}
</style>
</head>
<body>
<div class="sidebar">
    <div class="logo"><img src="/uploads/logo-tablerino.png" alt="Tablerino" style="height:190px;width:auto;object-fit:contain;display:block;"></div>
    <a href="/admin/index.html">📋 Comenzi</a>
    <a href="/admin/meniu.html">🍕 Meniu</a>
    <a href="/admin/mese.html">🪑 Mese</a>
    <a href="/admin/istoric.html">📂 Istoric</a>
    <a href="/admin/rezervari.html" class="owner-only">📅 Rezervări</a>
    <a href="/admin/recenzii.html" class="activ">⭐ Recenzii</a>
    <a href="/admin/raport.html">📊 Rapoarte</a>
    <a href="/admin/setari.html">🎨 Design</a>
    <a href="/admin/reclame.html">📢 Reclame</a>
    <a href="/admin/audit.html">🔍 Audit</a>
    <a href="/admin/ospatari.html">👤 Ospătari</a>
    <div style="margin-top:auto;padding:8px 4px;display:flex;gap:6px;justify-content:center">
        <a href="?lang=ro" style="padding:5px 10px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;background:#6c47ff;color:#fff">🇷🇴 RO</a>
        <a href="?lang=en" style="padding:5px 10px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;color:#aaa">🇬🇧 EN</a>
    </div>
    <a href="#" class="logout" onclick="logout(event)">🚪 Ieșire</a>
</div>

<!-- Header mobil -->
<div class="header-mobil" style="display:none;background:#1a1a2e;color:#fff;padding:12px 16px;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;">
    <span>🍽️ <strong>Tablerino</strong></span>
    <div style="display:flex;gap:8px;align-items:center">
        <a href="?lang=ro" style="color:#fff;font-size:13px;font-weight:700;text-decoration:none;padding:4px 8px;border-radius:6px;background:#6c47ff">🇷🇴 RO</a>
        <a href="?lang=en" style="color:#aaa;font-size:13px;font-weight:700;text-decoration:none;padding:4px 8px;border-radius:6px;">🇬🇧 EN</a>
    </div>
</div>

<div class="main">
    <h2>Recenzii & rating</h2>
    <p class="sub">Vezi ce spun clienții după ce au mâncat la tine.</p>

    <div class="sumar-box" id="sumarBox">
        <div class="sumar-gol">Se încarcă...</div>
    </div>

    <div class="recenzii-lista" id="recenziiLista">
        <div class="gol">Se încarcă...</div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
function logout(e) {
    if (e) e.preventDefault();
    fetch('/api/admin/logout', { method: 'POST' }).finally(function () {
        location.href = '/admin/login.html';
    });
}

function showToast(msg, tip) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (tip === 'err' ? ' err' : '');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
}

function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// Render 5 stars; `plin` can be fractional for the summary (proportional fill),
// or an integer for a single review.
function steleHtml(plin) {
    let html = '';
    for (let i = 1; i <= 5; i++) {
        html += '<span class="' + (i <= Math.round(plin) ? 'star-on' : 'star-off') + '">★</span>';
    }
    return html;
}

function formatData(d) {
    try {
        return new Date(d).toLocaleDateString('ro-RO', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return d; }
}

function randeazaSumar(medie, total) {
    const box = document.getElementById('sumarBox');
    if (!total) {
        box.innerHTML = '<div class="sumar-stele">' + steleHtml(0) + '</div>'
            + '<div class="sumar-dreapta"><div class="sumar-gol">—</div><div class="sumar-text">Nicio recenzie încă</div></div>';
        return;
    }
    const m = Number(medie) || 0;
    box.innerHTML = ''
        + '<div class="sumar-medie">' + m.toFixed(1) + '</div>'
        + '<div class="sumar-dreapta">'
        +     '<div class="sumar-stele">' + steleHtml(m) + '</div>'
        +     '<div class="sumar-text">din ' + total + ' ' + (total === 1 ? 'recenzie' : 'recenzii') + '</div>'
        + '</div>';
}

function randeazaCard(rec) {
    const comentHtml = rec.comentariu
        ? '<div class="rec-coment">' + escapeHtml(rec.comentariu) + '</div>'
        : '<div class="rec-coment gol">fără comentariu</div>';
    return '' +
        '<div class="recenzie-card">' +
            '<div class="rec-head">' +
                '<span class="rec-stele">' + steleHtml(rec.rating) + '</span>' +
                '<span class="rec-data">' + escapeHtml(formatData(rec.created_at)) + '</span>' +
            '</div>' +
            comentHtml +
            '<div class="rec-meta">' +
                '<div class="rec-meta-info">' +
                    '<span>👤 ' + escapeHtml(rec.nume || 'Anonim') + '</span>' +
                    '<span>🪑 ' + escapeHtml(rec.masa_nume || '—') + '</span>' +
                '</div>' +
                '<button class="btn-sterge" onclick="stergeRecenzie(' + rec.id + ')">🗑 Șterge</button>' +
            '</div>' +
        '</div>';
}

async function incarcaRecenzii() {
    const lista = document.getElementById('recenziiLista');
    try {
        const r = await fetch('/api/admin/recenzii');
        const d = await r.json();
        if (!d.ok) { lista.innerHTML = '<div class="gol">Eroare la încărcare.</div>'; return; }
        randeazaSumar(d.medie, d.total);
        if (!d.recenzii || !d.recenzii.length) {
            lista.innerHTML = '<div class="gol">Nicio recenzie încă.</div>';
            return;
        }
        lista.innerHTML = d.recenzii.map(randeazaCard).join('');
    } catch (e) {
        lista.innerHTML = '<div class="gol">Eroare de conexiune.</div>';
    }
}

async function stergeRecenzie(id) {
    if (!confirm('Ștergi această recenzie?')) return;
    const r = await fetch('/api/admin/sterge_recenzie', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.ok) { showToast('Recenzie ștearsă'); incarcaRecenzii(); }
    else showToast(d.msg || 'Eroare', 'err');
}

fetch('/api/admin/me').then(function (r) {
    if (!r.ok) { location.href = '/admin/login.html'; return; }
    return r.json();
}).then(function (me) {
    if (!me) return;
    if (me.role === 'ospatar') { location.href = '/admin/index.html'; return; }
    incarcaRecenzii();
});
</script>
</body>
</html>
