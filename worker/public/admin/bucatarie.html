<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/uploads/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/uploads/favicon-16.png">
<link rel="apple-touch-icon" href="/uploads/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablerino - Bucătărie</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #0f1117; color: #e8e8ef; }
.sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; background: #1a1a2e; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.sidebar .logo { margin-bottom: 20px; padding: 4px; display: flex; align-items: center; justify-content: center; }
.sidebar .logo img { height: 64px; width: auto; object-fit: contain; background: #fff; border-radius: 10px; padding: 6px; }
.sidebar a { color: #aaa; text-decoration: none; padding: 10px 12px; border-radius: 8px; font-size: 14px; display: flex; align-items: center; gap: 10px; transition: background .15s, color .15s; }
.sidebar a:hover, .sidebar a.activ { background: #6c47ff; color: #fff; }
.sidebar .logout { margin-top: auto; }

.main { margin-left: 220px; padding: 20px 24px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.topbar h2 { font-size: 22px; }
.topbar .meta { font-size: 13px; color: #8a8a9a; display: flex; align-items: center; gap: 14px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; display: inline-block; margin-right: 5px; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.col h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: #8a8a9a; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.col h3 .n { background: #2a2a3e; color: #cfcfe0; border-radius: 20px; padding: 1px 9px; font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }

.tk { background: #1b1e27; border: 1px solid #2a2e3a; border-radius: 14px; padding: 14px; border-left: 5px solid #3b82f6; }
.tk.gata { border-left-color: #22c55e; opacity: .92; }
.tk-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.tk-masa { font-size: 18px; font-weight: 800; }
.tk-nr { font-size: 12px; color: #8a8a9a; }
.tk-age { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
.age-ok { color: #22c55e; } .age-mid { color: #f59e0b; } .age-late { color: #ef4444; }
.tk-obs { font-size: 12px; color: #c7a23b; background: #2a2410; border-radius: 6px; padding: 5px 8px; margin-bottom: 10px; }
.tk-prod { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 8px; cursor: pointer; user-select: none; transition: background .12s; }
.tk-prod:hover { background: #232733; }
.tk-prod .chk { width: 24px; height: 24px; border-radius: 6px; border: 2px solid #4a5060; display: grid; place-items: center; flex-shrink: 0; font-size: 15px; color: transparent; }
.tk-prod.done .chk { background: #22c55e; border-color: #22c55e; color: #0f1117; }
.tk-prod .qty { font-weight: 800; color: #6c9bff; min-width: 26px; }
.tk-prod .nm { flex: 1; font-size: 15px; }
.tk-prod.done .nm { text-decoration: line-through; color: #6a6a7a; }
.tk-foot { margin-top: 10px; }
.btn-gata { width: 100%; background: #22c55e; color: #0b2e18; border: none; padding: 10px; border-radius: 9px; font-size: 13px; font-weight: 800; cursor: pointer; }
.btn-undo { width: 100%; background: #2a2e3a; color: #cfcfe0; border: none; padding: 9px; border-radius: 9px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.gol { color: #6a6a7a; font-size: 14px; padding: 30px 10px; text-align: center; }

@media (max-width: 820px) {
    .sidebar { position: fixed; left: 0; right: 0; top: auto; bottom: 0; width: 100%; height: 60px; flex-direction: row; padding: 0 4px; justify-content: flex-start; align-items: center; border-top: 1px solid #2a2a3e; z-index: 100; overflow-x: auto; overflow-y: hidden; gap: 0; }
    .sidebar .logo { display: none; }
    .sidebar .logout { margin-top: 0; }
    .sidebar a { flex-direction: column; gap: 2px; font-size: 10px; padding: 6px 10px; border-radius: 6px; justify-content: center; text-align: center; flex: 0 0 auto; white-space: nowrap; }
    .main { margin-left: 0; padding: 14px 12px 80px; }
    .cols { grid-template-columns: 1fr; gap: 24px; }
}
</style>
</head>
<body>

<div class="main">
    <div class="topbar">
        <h2>🍳 Bucătărie — comenzi live</h2>
        <div class="meta">
            <span><span class="dot"></span>actualizare automată</span>
            <span id="ultima"></span>
        </div>
    </div>
    <div class="cols">
        <div class="col">
            <h3>De preparat <span class="n" id="nPrep">0</span></h3>
            <div class="grid" id="gridPrep"><div class="gol">Se încarcă...</div></div>
        </div>
        <div class="col">
            <h3>Gata de servit <span class="n" id="nGata">0</span></h3>
            <div class="grid" id="gridGata"><div class="gol">—</div></div>
        </div>
    </div>
</div>

<script>
function logout(e) { if (e) e.preventDefault(); fetch('/api/admin/logout', { method: 'POST' }).finally(function () { location.href = '/admin/login.html'; }); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ageClass(sec) { return sec < 300 ? 'age-ok' : (sec < 600 ? 'age-mid' : 'age-late'); }
function ageText(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m > 0 ? (m + ' min ' + s + 's') : (s + 's'); }

let BUSY = false;
async function incarca() {
    if (BUSY) return;
    let d;
    try { d = await (await fetch('/api/admin/comenzi')).json(); } catch (e) { return; }
    const comenzi = (d.comenzi || []).filter(c => c.status !== 'servita');
    const prep = [], gata = [];
    comenzi.forEach(c => {
        const prod = c.produse || [];
        const allReady = prod.length > 0 && prod.every(p => p.pregatit == 1);
        (allReady ? gata : prep).push(c);
    });
    document.getElementById('gridPrep').innerHTML = prep.length ? prep.map(cardHtml).join('') : '<div class="gol">Nicio comandă de preparat 🎉</div>';
    document.getElementById('gridGata').innerHTML = gata.length ? gata.map(c => cardHtml(c, true)).join('') : '<div class="gol">—</div>';
    document.getElementById('nPrep').textContent = prep.length;
    document.getElementById('nGata').textContent = gata.length;
    document.getElementById('ultima').textContent = 'ultima: ' + new Date().toLocaleTimeString('ro-RO');
}

function cardHtml(c, gata) {
    const prod = c.produse || [];
    const items = prod.map(p =>
        '<div class="tk-prod ' + (p.pregatit == 1 ? 'done' : '') + '" onclick="toggleProd(' + p.id + ',' + (p.pregatit == 1 ? 0 : 1) + ')">' +
            '<span class="chk">✓</span>' +
            '<span class="qty">' + (p.cantitate || 1) + '×</span>' +
            '<span class="nm">' + esc(p.nume_produs) + '</span>' +
        '</div>'
    ).join('');
    const foot = gata
        ? '<div class="tk-foot"><button class="btn-undo" onclick="comandaGata(' + c.id + ',0)">↩ Înapoi la preparare</button></div>'
        : '<div class="tk-foot"><button class="btn-gata" onclick="comandaGata(' + c.id + ',1)">✓ Toate gata</button></div>';
    return '<div class="tk ' + (gata ? 'gata' : '') + '">' +
        '<div class="tk-head"><span class="tk-masa">' + esc(c.masa_nume || 'Masă') + '</span><span class="tk-nr">#' + (c.nr_ordine_zi || c.id) + '</span></div>' +
        '<div class="tk-age ' + ageClass(c.varsta_sec || 0) + '">⏱ ' + ageText(Number(c.varsta_sec) || 0) + '</div>' +
        (c.observatii ? '<div class="tk-obs">📝 ' + esc(c.observatii) + '</div>' : '') +
        items + foot +
    '</div>';
}

async function toggleProd(id, val) {
    BUSY = true;
    try { await fetch('/api/admin/bucatarie_produs_gata', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ comanda_produs_id: id, pregatit: val }) }); }
    finally { BUSY = false; }
    incarca();
}
async function comandaGata(id, val) {
    BUSY = true;
    try { await fetch('/api/admin/bucatarie_comanda_gata', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ comanda_id: id, pregatit: val }) }); }
    finally { BUSY = false; }
    incarca();
}

fetch('/api/admin/me').then(function (r) {
    if (!r.ok) { location.href = '/admin/login.html'; return; }
    return r.json();
}).then(function (me) {
    if (!me) return;
    incarca();
    setInterval(incarca, 6000);
});
</script>
