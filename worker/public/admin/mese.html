<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/uploads/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/uploads/favicon-16.png">
<link rel="apple-touch-icon" href="/uploads/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablerino - Mese</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #f0f0f5; color: #111; }
.sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; background: #1a1a2e; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; }
.sidebar .logo { margin-bottom: 20px; padding: 4px; display: flex; align-items: center; justify-content: center; }
.sidebar .logo img { height: 64px; width: auto; object-fit: contain; background: #fff; border-radius: 10px; padding: 6px; }
.sidebar a { color: #aaa; text-decoration: none; padding: 10px 12px; border-radius: 8px; font-size: 14px; display: flex; align-items: center; gap: 10px; transition: background .15s, color .15s; }
.sidebar a:hover, .sidebar a.activ { background: #6c47ff; color: #fff; }
.sidebar .logout { margin-top: auto; }
.main { margin-left: 220px; padding: 32px; }
.main h2 { font-size: 20px; margin-bottom: 8px; }
.main p.sub { color: #888; font-size: 14px; margin-bottom: 24px; }

.adauga-form { display: flex; gap: 10px; margin-bottom: 32px; }
.adauga-form input { padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; width: 220px; }
.adauga-form input:focus { border-color: #6c47ff; }
.btn-add { padding: 10px 18px; background: #6c47ff; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }

.mese-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.masa-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 8px rgba(0,0,0,0.06); }
.masa-card h3 { font-size: 17px; margin-bottom: 6px; }
.masa-token { font-size: 11px; color: #aaa; font-family: monospace; margin-bottom: 16px; word-break: break-all; }
.masa-url { font-size: 12px; color: #6c47ff; margin-bottom: 16px; word-break: break-all; }
.masa-actiuni { display: flex; gap: 8px; }
.btn-copie { flex: 1; padding: 8px; background: #ede9ff; color: #6c47ff; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
.btn-sterge { padding: 8px 14px; background: #ffebee; color: #c62828; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
.gol { color: #aaa; font-size: 14px; padding: 40px; text-align: center; }
.toast { position: fixed; bottom: 24px; right: 24px; background: #333; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 13px; display: none; }


/* ── RESPONSIVE SIDEBAR ── */
@media (max-width: 768px) {
    .header-mobil { display: flex !important; }
    .sidebar { position: fixed; left: 0; right: 0; top: auto; bottom: 0; width: 100%; height: 62px; flex-direction: row; padding: 0; justify-content: space-around; align-items: center; border-top: 1px solid #2a2a3e; z-index: 100; }
    .sidebar .logo { display: none; }
    .sidebar .logout { margin-top: 0; }
    .sidebar a { flex-direction: column; gap: 2px; font-size: 10px; padding: 6px 8px; border-radius: 6px; flex: 1; justify-content: center; text-align: center; font-weight: 600; }
    .main { margin-left: 0 !important; padding: 14px 12px 80px !important; }
    .main h2 { font-size: 18px !important; }
    .layout { grid-template-columns: 1fr !important; }
    .teme-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .mese-grid { grid-template-columns: 1fr !important; }
    .adauga-form { flex-direction: column; }
    table { font-size: 12px; }
    th, td { padding: 8px 10px; }
    .filtre-bar { flex-wrap: wrap; }
    .sumar { gap: 8px; }
    .sumar-card { padding: 12px 14px; min-width: 0; flex: 1; }
    .sectiune { padding: 18px; }
    .produs-item { flex-wrap: wrap; }
}

</style>
</head>
<body>
<div class="sidebar">
    <div class="logo"><img src="/uploads/logo-tablerino.png" alt="Tablerino" style="height:190px;width:auto;object-fit:contain;display:block;"></div>
    <a href="/admin/index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6"/><path d="M9 16h6"/></svg> Comenzi</a>
    <a href="/admin/meniu.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto"><path d="M12 7v14"/><path d="M4 5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2 2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v12a1 1 0 0 1-1 1h-6a2 2 0 0 0-2 2 2 2 0 0 0-2-2H5a1 1 0 0 1-1-1z"/></svg> Meniu</a>
    <a href="/admin/mese.html" class="activ"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto"><path d="M3 10h18"/><path d="M5 10V7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M6 10v9"/><path d="M18 10v9"/></svg> Mese</a>
    <a href="/admin/istoric.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg> Istoric</a>
    <a href="/admin/rezervari.html" class="owner-only"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg> Rezervări</a>
    <a href="/admin/recenzii.html" class="owner-only"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto"><path d="M12 2.5l2.9 6 6.6.6-5 4.3 1.5 6.5L12 16.9 6 19.9l1.5-6.5-5-4.3 6.6-.6z"/></svg> Recenzii</a>
    <a href="/admin/raport.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto"><line x1="4" y1="20" x2="4" y2="12"/><line x1="10" y1="20" x2="10" y2="5"/><line x1="16" y1="20" x2="16" y2="9"/><line x1="3" y1="20" x2="21" y2="20"/></svg> Rapoarte</a>
    <a href="/admin/setari.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto"><circle cx="13.5" cy="6.5" r=".9" fill="currentColor" stroke="none"/><circle cx="17.5" cy="10.5" r=".9" fill="currentColor" stroke="none"/><circle cx="8.5" cy="7.5" r=".9" fill="currentColor" stroke="none"/><circle cx="6.5" cy="12.5" r=".9" fill="currentColor" stroke="none"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.6-.7 1.6-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.7 1.7-1.7H18c2.2 0 4-1.8 4-4C22 6 17.5 2 12 2z"/></svg> Design</a>
    <a href="/admin/reclame.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto"><path d="m3 11 18-5v12L3 14z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg> Reclame</a>
    <a href="/admin/audit.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg> Audit</a>
    <a href="/admin/ospatari.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/></svg> Ospătari</a>
        <div style="margin-top:auto;padding:8px 4px;display:flex;gap:6px;justify-content:center">
        <a href="?lang=ro" style="padding:5px 10px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;background:#6c47ff;color:#fff">🇷🇴 RO</a>
        <a href="?lang=en" style="padding:5px 10px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;color:#aaa">🇬🇧 EN</a>
    </div>
    <a href="#" class="logout" onclick="logout(event)">🚪 Ieșire</a>
</div>

<!-- Header mobil -->
<div class="header-mobil" style="display:none;background:#1a1a2e;color:#fff;padding:12px 16px;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;">
    <span>🍽️ <strong>Tablerino</strong></span>
    <div style="display:flex;gap:8px;align-items:center">
        <a href="?lang=ro" style="color:#fff;font-size:13px;font-weight:700;text-decoration:none;padding:4px 8px;border-radius:6px;background:#6c47ff">🇷🇴 RO</a>
        <a href="?lang=en" style="color:#aaa;font-size:13px;font-weight:700;text-decoration:none;padding:4px 8px;border-radius:6px;">🇬🇧 EN</a>
    </div>
</div>

<div class="main">
    <h2>Mese</h2>
    <p class="sub">Fiecare masă are un link unic pe care îl deschizi pe tableta de la acea masă.</p>

    <div class="adauga-form">
        <input type="text" id="numeMasa" placeholder="Ex: Masa 1, Terasă 3...">
        <input type="number" id="capacitateMasa" min="1" max="50" placeholder="ex: 4" style="width:140px" title="Capacitate (persoane)">
        <button class="btn-add" onclick="adaugaMasa()">+ Adaugă masă</button>
    </div>

    <div class="mese-grid" id="meseGrid">
        <div class="gol">Se încarcă...</div>
    </div>
</div>
<div class="toast" id="toast">Link copiat!</div>

<script>
function logout(e) {
    if (e) e.preventDefault();
    fetch('/api/admin/logout', { method: 'POST' }).finally(function () {
        location.href = '/admin/login.html';
    });
}

const baseUrl = location.origin;
const _mt = {
    noTables:    'Nicio masă adăugată.',
    token:       'Token',
    copyLink:    'Copiază link tabletă',
    deleteConf:  'Ștergi masa? Comenzile asociate vor fi pierdute.',
    delete:      'Șterge',
    responsible: 'Ospătar responsabil',
    none:        '— fără —',
};

function escHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

let meseList = [];
let ospatariList = [];

async function incarcaOspatari() {
    try {
        const r = await fetch('/api/admin/ospatari');
        const d = await r.json();
        ospatariList = d.ospatari || [];
    } catch (e) { ospatariList = []; }
}

async function incarcaMese() {
    if (!ospatariList.length) await incarcaOspatari();
    const r = await fetch('/api/admin/mese');
    const d = await r.json();
    meseList = d.mese || [];
    const grid = document.getElementById('meseGrid');
    if (!meseList.length) { grid.innerHTML = `<div class="gol">${_mt.noTables}</div>`; return; }
    grid.innerHTML = meseList.map(m => {
        const url = `${baseUrl}/masa/?token=${m.token}`;
        const capText = (m.capacitate != null) ? `👥 ${m.capacitate} persoane` : '👥 nespecificat';
        const optiuni = [`<option value="">${_mt.none}</option>`].concat(
            ospatariList.map(o => `<option value="${o.id}" ${o.id === m.ospatar_id ? 'selected' : ''}>${escHtml(o.nume)}</option>`)
        ).join('');
        return `
        <div class="masa-card">
            <h3>🪑 ${m.nume}</h3>
            <div class="masa-token">${_mt.token}: ${m.token}</div>
            <div class="masa-url">${url}</div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:13px;color:#555">
                <span style="flex:1">${capText}</span>
                <input type="number" min="1" max="50" value="${m.capacitate != null ? m.capacitate : ''}" id="cap_${m.id}" placeholder="ex: 4" style="width:70px;padding:6px 8px;border:1px solid #ddd;border-radius:8px;font-size:13px;outline:none">
                <button class="btn-copie" style="flex:0 0 auto;padding:7px 10px" onclick="salveazaCapacitate(${m.id})">💾 Salvează</button>
            </div>
            <div style="margin-bottom:16px">
                <label style="display:block;font-size:12px;color:#888;margin-bottom:5px">👤 ${_mt.responsible}</label>
                <select id="osp_${m.id}" onchange="setOspatarMasa(${m.id}, this)" style="width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;outline:none;background:#fff">${optiuni}</select>
            </div>
            <div class="masa-actiuni">
                <button class="btn-copie" onclick="copiazaLink('${url}')">📋 ${_mt.copyLink}</button>
                <button class="btn-sterge" onclick="stergeMasa(${m.id})">${_mt.delete}</button>
            </div>
        </div>`;
    }).join('');
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
}

async function salveazaCapacitate(id) {
    const m = meseList.find(x => String(x.id) === String(id));
    if (!m) return;
    const val = document.getElementById('cap_' + id).value;
    const capacitate = Number(val) || null;
    await fetch('/api/admin/editeaza_masa', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ masa_id: id, nume: m.nume, capacitate }) });
    showToast('Capacitate salvată!');
    incarcaMese();
}

async function setOspatarMasa(masaId, sel) {
    const ospatarId = Number(sel.value) || null;
    try {
        const r = await fetch('/api/admin/set_ospatar_masa', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ masa_id: masaId, ospatar_id: ospatarId }) });
        const d = await r.json().catch(() => ({}));
        if (d.ok) {
            const m = meseList.find(x => x.id === masaId);
            if (m) m.ospatar_id = ospatarId;
            showToast('Ospătar actualizat!');
        } else {
            showToast(d.msg || 'Eroare');
        }
    } catch (e) { showToast('Eroare conexiune'); }
}

async function adaugaMasa() {
    const nume = document.getElementById('numeMasa').value.trim();
    if (!nume) return;
    const capVal = document.getElementById('capacitateMasa').value;
    const body = { actiune: 'adauga_masa', nume };
    const capacitate = Number(capVal) || null;
    if (capacitate) body.capacitate = capacitate;
    await fetch('/api/admin/adauga_masa', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    document.getElementById('numeMasa').value = '';
    document.getElementById('capacitateMasa').value = '';
    incarcaMese();
}

async function stergeMasa(id) {
    if (!confirm(_mt.deleteConf)) return;
    await fetch('/api/admin/sterge_masa', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ actiune: 'sterge_masa', masa_id: id }) });
    incarcaMese();
}

function copiazaLink(url) {
    navigator.clipboard.writeText(url).then(() => {
        showToast('Link copiat!');
    });
}

fetch('/api/admin/me').then(function (r) {
    if (!r.ok) { location.href = '/admin/login.html'; return; }
    return r.json();
}).then(function (me) {
    if (!me) return;
    if (me.role === 'ospatar') { location.href = '/admin/index.html'; return; }
    incarcaMese();
});
</script>
</body>
</html>
