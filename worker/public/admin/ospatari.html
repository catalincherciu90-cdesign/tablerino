<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/uploads/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/uploads/favicon-16.png">
<link rel="apple-touch-icon" href="/uploads/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablerino - Ospătari</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #f0f0f5; color: #111; }
.sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; background: #1a1a2e; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; }
.sidebar .logo { margin-bottom: 20px; padding: 4px; display: flex; align-items: center; justify-content: center; }
.sidebar .logo img { height: 64px; width: auto; object-fit: contain; background: #fff; border-radius: 10px; padding: 6px; }
.sidebar a { color: #aaa; text-decoration: none; padding: 10px 12px; border-radius: 8px; font-size: 14px; display: flex; align-items: center; gap: 10px; transition: background .15s, color .15s; }
.sidebar a:hover, .sidebar a.activ { background: #6c47ff; color: #fff; }
.sidebar .logout { margin-top: auto; }
.main { margin-left: 220px; padding: 32px; max-width: 960px; }
.main h2 { font-size: 20px; margin-bottom: 8px; }
.main p.sub { color: #888; font-size: 14px; margin-bottom: 24px; }

.adauga-form { background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 1px 8px rgba(0,0,0,0.06); margin-bottom: 28px; }
.adauga-form h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
.adauga-form .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.adauga-form .field { flex: 1; min-width: 180px; }
.adauga-form label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
.adauga-form input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border-color .2s; }
.adauga-form input:focus { border-color: #6c47ff; }
.btn-add { padding: 10px 18px; background: #6c47ff; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn-add:hover { background: #5a38e0; }

.tabel-wrap { background: #fff; border-radius: 14px; box-shadow: 0 1px 8px rgba(0,0,0,0.06); overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 14px 18px; text-align: left; font-size: 14px; }
th { background: #f8f8fc; color: #555; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
tbody tr { border-top: 1px solid #f0f0f0; }
td .nume { font-weight: 600; }
td .email { color: #888; font-size: 13px; }
.badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: .5px; }
.badge.activ { background: #d1fae5; color: #065f46; }
.badge.inactiv { background: #fee2e2; color: #c62828; }
.actiuni { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-sm { padding: 6px 12px; border: none; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; }
.btn-toggle { background: #ede9ff; color: #6c47ff; }
.btn-reset { background: #fff7ed; color: #c2410c; }
.btn-sterge { background: #ffebee; color: #c62828; }
.btn-sm:hover { opacity: .85; }
.gol { color: #aaa; font-size: 14px; padding: 40px; text-align: center; }
.toast { position: fixed; bottom: 24px; right: 24px; background: #10b981; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 13px; display: none; z-index: 999; }
.toast.err { background: #e53e3e; }

@media (max-width: 768px) {
    .header-mobil { display: flex !important; }
    .sidebar { position: fixed; left: 0; right: 0; top: auto; bottom: 0; width: 100%; height: 62px; flex-direction: row; padding: 0; justify-content: space-around; align-items: center; border-top: 1px solid #2a2a3e; z-index: 100; }
    .sidebar .logo { display: none; }
    .sidebar .logout { margin-top: 0; }
    .sidebar a { flex-direction: column; gap: 2px; font-size: 10px; padding: 6px 8px; border-radius: 6px; flex: 1; justify-content: center; text-align: center; font-weight: 600; }
    .main { margin-left: 0 !important; padding: 14px 12px 80px !important; }
    .adauga-form .row { flex-direction: column; align-items: stretch; }
    .tabel-wrap { overflow-x: auto; }
    th, td { padding: 10px 12px; }
}
</style>
</head>
<body>
<div class="sidebar">
    <div class="logo"><img src="/uploads/logo-tablerino.png" alt="Tablerino" style="height:190px;width:auto;object-fit:contain;display:block;"></div>
    <a href="/admin/index.html">📋 Comenzi</a>
    <a href="/admin/meniu.html">🍕 Meniu</a>
    <a href="/admin/mese.html">🪑 Mese</a>
    <a href="/admin/istoric.html">📂 Istoric</a>
    <a href="/admin/raport.html">📊 Rapoarte</a>
    <a href="/admin/setari.html">🎨 Design</a>
    <a href="/admin/reclame.html">📢 Reclame</a>
    <a href="/admin/audit.html">🔍 Audit</a>
    <a href="/admin/ospatari.html" class="activ">👤 Ospătari</a>
    <div style="margin-top:auto;padding:8px 4px;display:flex;gap:6px;justify-content:center">
        <a href="?lang=ro" style="padding:5px 10px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;background:#6c47ff;color:#fff">🇷🇴 RO</a>
        <a href="?lang=en" style="padding:5px 10px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;color:#aaa">🇬🇧 EN</a>
    </div>
    <a href="#" class="logout" onclick="logout(event)">🚪 Ieșire</a>
</div>

<div class="main">
    <h2>Ospătari</h2>
    <p class="sub">Conturile de ospătar pot prelua comenzi și pot marca produsele indisponibile. Se autentifică pe aceeași pagină de login.</p>

    <div class="adauga-form">
        <h3>➕ Adaugă ospătar</h3>
        <div class="row">
            <div class="field">
                <label>Nume</label>
                <input type="text" id="numeOspatar" placeholder="Ex: Ion Popescu">
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" id="emailOspatar" placeholder="ion@restaurant.ro" autocomplete="off">
            </div>
            <div class="field">
                <label>Parolă (minim 6 caractere)</label>
                <input type="password" id="parolaOspatar" placeholder="••••••••" autocomplete="new-password">
            </div>
            <button class="btn-add" onclick="adaugaOspatar()">+ Adaugă</button>
        </div>
    </div>

    <div class="tabel-wrap" id="tabelWrap">
        <div class="gol">Se încarcă...</div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
function logout(e) {
    if (e) e.preventDefault();
    fetch('/api/admin/logout', { method: 'POST' }).finally(function () {
        location.href = '/admin/login.html';
    });
}

function showToast(msg, tip = 'ok') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (tip === 'err' ? ' err' : '');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

async function incarcaOspatari() {
    const r = await fetch('/api/admin/ospatari');
    const d = await r.json();
    const wrap = document.getElementById('tabelWrap');
    if (!d.ok) { wrap.innerHTML = `<div class="gol">Eroare la încărcare.</div>`; return; }
    if (!d.ospatari.length) { wrap.innerHTML = `<div class="gol">Niciun ospătar adăugat.</div>`; return; }
    wrap.innerHTML = `
    <table>
        <thead>
            <tr><th>Nume</th><th>Email</th><th>Status</th><th>Acțiuni</th></tr>
        </thead>
        <tbody>
        ${d.ospatari.map(o => `
            <tr>
                <td><span class="nume">${escapeHtml(o.nume)}</span></td>
                <td><span class="email">${escapeHtml(o.email)}</span></td>
                <td><span class="badge ${o.activ ? 'activ' : 'inactiv'}">${o.activ ? 'Activ' : 'Inactiv'}</span></td>
                <td>
                    <div class="actiuni">
                        <button class="btn-sm btn-toggle" onclick="toggleOspatar(${o.id})">${o.activ ? 'Dezactivează' : 'Activează'}</button>
                        <button class="btn-sm btn-reset" onclick="resetParola(${o.id})">Resetează parola</button>
                        <button class="btn-sm btn-sterge" onclick="stergeOspatar(${o.id}, '${escapeHtml(o.nume).replace(/'/g, "\\'")}')">Șterge</button>
                    </div>
                </td>
            </tr>
        `).join('')}
        </tbody>
    </table>`;
}

async function adaugaOspatar() {
    const nume = document.getElementById('numeOspatar').value.trim();
    const email = document.getElementById('emailOspatar').value.trim();
    const parola = document.getElementById('parolaOspatar').value;
    if (!nume || !email || !parola) { showToast('Completează toate câmpurile.', 'err'); return; }
    if (parola.length < 6) { showToast('Parola trebuie să aibă minim 6 caractere.', 'err'); return; }
    const r = await fetch('/api/admin/adauga_ospatar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nume, email, parola })
    });
    const d = await r.json();
    if (d.ok) {
        document.getElementById('numeOspatar').value = '';
        document.getElementById('emailOspatar').value = '';
        document.getElementById('parolaOspatar').value = '';
        showToast('Ospătar adăugat!');
        incarcaOspatari();
    } else {
        showToast(d.msg || 'Eroare', 'err');
    }
}

async function toggleOspatar(id) {
    const r = await fetch('/api/admin/toggle_ospatar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
    });
    const d = await r.json();
    if (d.ok) incarcaOspatari();
    else showToast(d.msg || 'Eroare', 'err');
}

async function resetParola(id) {
    const parola = prompt('Parolă nouă (minim 6 caractere):');
    if (parola === null) return;
    if (parola.length < 6) { showToast('Parola trebuie să aibă minim 6 caractere.', 'err'); return; }
    const r = await fetch('/api/admin/reset_parola_ospatar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, parola })
    });
    const d = await r.json();
    if (d.ok) showToast('Parolă resetată!');
    else showToast(d.msg || 'Eroare', 'err');
}

async function stergeOspatar(id, nume) {
    if (!confirm(`Ștergi contul ospătarului ${nume}?`)) return;
    const r = await fetch('/api/admin/sterge_ospatar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
    });
    const d = await r.json();
    if (d.ok) { showToast('Ospătar șters'); incarcaOspatari(); }
    else showToast(d.msg || 'Eroare', 'err');
}

fetch('/api/admin/me').then(function (r) {
    if (!r.ok) { location.href = '/admin/login.html'; return; }
    return r.json();
}).then(function (d) {
    if (!d) return;
    if (d.role === 'ospatar') { location.href = '/admin/index.html'; return; }
    incarcaOspatari();
});
</script>
</body>
</html>
