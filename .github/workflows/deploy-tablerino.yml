name: Deploy Tablerino to Cloudflare

# Deploys the Worker in worker/ to Cloudflare. Runs automatically on push to the
# development branch, and can be triggered manually from the Actions tab.
#
# Required GitHub repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - token with Workers Scripts/D1/R2 edit + Account read
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id
#   SESSION_SECRET         - long random string for signing session cookies
#   GROQ_KEY               - Groq API key (for the AI menu extractor)
#   MASTER_EMAIL           - (optional) email for the first platform-admin user
#   MASTER_PASSWORD        - (optional) password for that user
#
# Before the first run you must create the D1 database + R2 bucket in the
# Cloudflare dashboard and paste the D1 database_id into worker/wrangler.toml.

on:
  workflow_dispatch:
  push:
    branches: ["claude/laughing-cerf-RzOCi"]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-tablerino.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 schema (idempotent)
        run: npx wrangler d1 execute tablerino --remote --file=./schema.sql --yes

      - name: Apply D1 migrations (idempotent — errors ignored when already applied)
        run: |
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE ospatari ADD COLUMN masa_default_id INTEGER" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE comenzi ADD COLUMN preluat_de INTEGER" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE restaurante ADD COLUMN rezervare_token TEXT" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE mese ADD COLUMN capacitate INTEGER" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE restaurante ADD COLUMN rez_capacitate INTEGER" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE mese ADD COLUMN ospatar_id INTEGER" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE restaurante ADD COLUMN escalare_sec INTEGER" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE comenzi ADD COLUMN preluat_la TEXT" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE comenzi ADD COLUMN push_nou_trimis INTEGER DEFAULT 0" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE comenzi ADD COLUMN push_escalare_trimis INTEGER DEFAULT 0" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE restaurante ADD COLUMN rezervari_publice INTEGER DEFAULT 0" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE restaurante ADD COLUMN descriere TEXT" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE restaurante ADD COLUMN categorie TEXT" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE restaurante ADD COLUMN oras TEXT" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE restaurante ADD COLUMN promovat INTEGER DEFAULT 0" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE restaurante ADD COLUMN abonament_status TEXT DEFAULT 'activ'" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE restaurante ADD COLUMN abonament_pret REAL" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE restaurante ADD COLUMN abonament_expira TEXT" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE restaurante ADD COLUMN evenimente_publice INTEGER DEFAULT 0" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE restaurante ADD COLUMN evenimente_descriere TEXT" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE restaurante ADD COLUMN evenimente_capacitate INTEGER" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE evenimente ADD COLUMN sala TEXT" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE comanda_produse ADD COLUMN pregatit INTEGER DEFAULT 0" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE evenimente ADD COLUMN pachet_id INTEGER" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE evenimente ADD COLUMN meniu_json TEXT" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE evenimente ADD COLUMN meniu_persoane INTEGER" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE evenimente ADD COLUMN meniu_pret_persoana REAL" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE evenimente ADD COLUMN meniu_total REAL" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE evenimente ADD COLUMN meniu_consumat INTEGER DEFAULT 0" || true
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE evenimente ADD COLUMN meniu_client TEXT" || true

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Set runtime secrets
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
        run: |
          # Cloudflare sometimes reports "latest version isn't deployed" for a few
          # seconds after `wrangler deploy`, which makes `secret put` race-fail.
          # Retry a few times; the secrets already exist from prior deploys, so a
          # persistent failure here must not break an otherwise-successful deploy.
          put_secret() {
            local name="$1" val="$2" attempt
            for attempt in 1 2 3 4 5; do
              if printf '%s' "$val" | npx wrangler secret put "$name"; then
                return 0
              fi
              echo "secret put $name failed (attempt $attempt) — waiting for version rollout..."
              sleep 10
            done
            echo "::warning::Could not set $name after retries; keeping existing value."
          }
          put_secret SESSION_SECRET "$SESSION_SECRET"
          put_secret GROQ_KEY "$GROQ_KEY"

      - name: Seed master user (if configured)
        env:
          MASTER_EMAIL: ${{ secrets.MASTER_EMAIL }}
          MASTER_PASSWORD: ${{ secrets.MASTER_PASSWORD }}
        run: |
          if [ -n "$MASTER_EMAIL" ] && [ -n "$MASTER_PASSWORD" ]; then
            node scripts/create-master.mjs "$MASTER_EMAIL" "$MASTER_PASSWORD" > master.sql
            npx wrangler d1 execute tablerino --remote --file=master.sql --yes
            rm -f master.sql
          else
            echo "MASTER_EMAIL / MASTER_PASSWORD not set — skipping master user seed."
          fi
