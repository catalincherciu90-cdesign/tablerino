name: Deploy Tablerino to Cloudflare

# Deploys the Worker in worker/ to Cloudflare. Runs automatically on push to the
# development branch, and can be triggered manually from the Actions tab.
#
# Required GitHub repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - token with Workers Scripts/D1/R2 edit + Account read
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id
#   SESSION_SECRET         - long random string for signing session cookies
#   GROQ_KEY               - Groq API key (for the AI menu extractor)
#   MASTER_EMAIL           - (optional) email for the first platform-admin user
#   MASTER_PASSWORD        - (optional) password for that user
#
# Before the first run you must create the D1 database + R2 bucket in the
# Cloudflare dashboard and paste the D1 database_id into worker/wrangler.toml.

on:
  workflow_dispatch:
  push:
    branches: ["claude/laughing-cerf-RzOCi"]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-tablerino.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 schema (idempotent)
        run: npx wrangler d1 execute tablerino --remote --file=./schema.sql --yes

      - name: Apply D1 migrations (idempotent — errors ignored when already applied)
        run: |
          npx wrangler d1 execute tablerino --remote --yes \
            --command "ALTER TABLE ospatari ADD COLUMN masa_default_id INTEGER" || true

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Set runtime secrets
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
        run: |
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
          printf '%s' "$GROQ_KEY" | npx wrangler secret put GROQ_KEY

      - name: Seed master user (if configured)
        env:
          MASTER_EMAIL: ${{ secrets.MASTER_EMAIL }}
          MASTER_PASSWORD: ${{ secrets.MASTER_PASSWORD }}
        run: |
          if [ -n "$MASTER_EMAIL" ] && [ -n "$MASTER_PASSWORD" ]; then
            node scripts/create-master.mjs "$MASTER_EMAIL" "$MASTER_PASSWORD" > master.sql
            npx wrangler d1 execute tablerino --remote --file=master.sql --yes
            rm -f master.sql
          else
            echo "MASTER_EMAIL / MASTER_PASSWORD not set — skipping master user seed."
          fi
